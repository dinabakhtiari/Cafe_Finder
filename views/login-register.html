<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Finder - Login & Register</title>
</head>
<body>
    <main>
        <section>
            <h2>Register</h2>
            <form action="/register" method="POST">
                <div>
                    <label for="reg-username">Username:</label>
                    <input type="text" id="reg-username" name="username" placeholder="e.g. dinab96" required>
                </div>
                <div>
                    <label for="reg-firstname">First Name:</label>
                    <input type="text" id="reg-firstname" name="firstname" placeholder="Your Firstname" required>
                </div>
                <div>
                    <label for="reg-lastname">Last Name:</label>
                    <input type="text" id="reg-lastname" name="lastname" placeholder="Your Lastname" required>
                </div>
                <div>
                    <label for="reg-email">Email:</label>
                    <input type="email" id="reg-email" name="email" placeholder="example@email.com" required>
                </div>
                <div>
                    <label for="reg-password">Password:</label>
                    <input type="password" id="reg-password" name="password" placeholder="Min. 8 characters" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
        </section>

        <hr>

        <section>
            <h2>Login</h2>
            <form action="/login" method="POST">
                <div>
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" name="email" placeholder="example@email.com" required>
                </div>
                <div>
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit">Log In</button>
            </form>
        </section>
    </main>

    <footer style="margin-top: 50px; padding: 20px 0; border-top: 1px solid #eee; text-align: center; font-size: 0.9em; color: gray;">
        <p>&copy; 2026 Cafe Finder. All rights reserved.</p>
        <p>
            <a href="/about" style="color: gray; margin: 0 10px;">About Us & Contact</a> | 
            <a href="/home" style="color: gray; margin: 0 10px;">Home</a>
        </p>
    </footer>
</body>
</html>
