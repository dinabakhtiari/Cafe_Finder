<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/css/style.css">
    <script src="../public/js/main.js"></script>
    <title>Cafe Finder - Search Results</title>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="/home">☕ Cafe Finder</a>
            </div>
            
            <nav>
                <ul>
                    <li><a href="/home">Home</a></li>
                    <li><a href="/about">About Us</a></li>
                    <li><a href="/profile">Profile</a></li>
                    <li><a href="/logout">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="results-main">
        <section class="city-header">
            <h1 class="city-title">Stuttgart, Germany</h1>
            <p class="city-subtitle">Specialty coffee guide with the best cafés in town.</p>
        </section>

        <section class="map-container">
            <div id="map-placeholder">
                <p>🗺️ Interactive Map View Component</p>
            </div>
        </section>

        <section class="cafes-grid-section">
            <div class="modern-cafes-grid">
                
                <article class="modern-cafe-card">
                    <a href="/cafes/1" class="card-link">
                        <img src="placeholder.jpg" alt="Symple Mitte Cafe">
                        <div class="card-overlay">
                            <h3>Symple Mitte</h3>
                        </div>
                    </a>
                </article>

                <article class="modern-cafe-card">
                    <a href="/cafes/2" class="card-link">
                        <img src="placeholder2.jpg" alt="Ingwer Cafe">
                        <div class="card-overlay">
                            <h3>Ingwer</h3>
                        </div>
                    </a>
                </article>

                <article class="modern-cafe-card">
                    <a href="/cafes/3" class="card-link">
                        <img src="placeholder3.jpg" alt="Kawa Roastery">
                        <div class="card-overlay">
                            <h3>Kawa Roastery</h3>
                        </div>
                    </a>
                </article>

            </div>
        </section>
    </main>

    <footer class="results-footer">
        <p>&copy; 2026 Cafe Finder. All rights reserved.</p>
        <p>
            <a href="/about" class="footer-link">About Us & Contact</a> | 
            <a href="/home" class="footer-link">Home</a>
        </p>
    </footer>
</body>
</html>
