<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Finder </title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="home">Home</a></li>
                <li><a href="about-us.html">About Us</a></li>
                <li><a href="user-profile.html">Profile</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <form action="/search" method="GET">
                
                <div>
                    <input type="text" name="search" placeholder="Search cafes by name...">
                </div>
                
                <div>
                    <h4>Filter Options:</h4>
            
                    <label for="city-input">City:</label>
                    <input type="text" id="city-input" name="city" placeholder="e.g. Stuttgart, Walldorf...">

                    <label for="tag-select">Feature:</label>
                    <select id="tag-select" name="tag">
                        <option value="">All Features</option>
                        <option value="wifi">Fast Wi-Fi</option>
                        <option value="quiet">Quiet Environment</option>
                        <option value="outlets">Power Outlets</option>
                    </select>
                </div>

                <div>
                    <label for="sort-select">Sort by:</label>
                    <select id="sort-select" name="sort">
                        <option value="newest">Newest First</option>
                        <option value="highest-rated">Highest Rated</option>
                        <option value="most-liked">Most Liked</option>
                    </select>
                </div>
                
                <button type="submit">Apply & Search</button>
            </form>
        </section>

        <section>
            <h2>Recommended Cafes</h2>
            <a href="/cafes/new">Add New Cafe</a>

            <article>
                <img src="placeholder.jpg" alt="Cafe interior with wooden tables">
                <h3>Melu Cafe</h3>
                <p>A perfect place for programming and study sessions near campus.</p>
                <p>Tags: <span>Fast Wi-Fi</span>, <span>Power Outlets</span></p>
                <a href="/cafes/1">View Details</a>
            </article>
        </section>
    </main>
</body>
</html>
